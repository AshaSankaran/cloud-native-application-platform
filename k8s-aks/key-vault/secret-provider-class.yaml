apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: cloud-native-keyvault
  namespace: cloud-native-app

spec:
  provider: azure

  secretObjects:
    - secretName: backend-secret
      type: Opaque
      data:
        - objectName: db-user
          key: DB_USER
        - objectName: db-password
          key: DB_PASSWORD

    - secretName: postgres-secret
      type: Opaque
      data:
        - objectName: postgres-user
          key: POSTGRES_USER
        - objectName: postgres-password
          key: POSTGRES_PASSWORD
        - objectName: postgres-db
          key: POSTGRES_DB

  parameters:
    usePodIdentity: "false"
    clientID: "YOUR_BACKEND_IDENTITY_CLIENT_ID"
    keyvaultName: "keyvault-cloud-native"
    tenantId: "9caa1572-da55-4a13-a5eb-19dc0ab12d29"

    objects: |
      array:
        - |
          objectName: db-user
          objectType: secret
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: postgres-db
          objectType: secret