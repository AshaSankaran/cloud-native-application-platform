apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-statefulset
  namespace: cloud-native-app  
spec:
  serviceName: postgres-service 
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres-container
          image: acrcloudnative.azurecr.io/cloud-native-postgres:IMAGE_TAG
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          imagePullPolicy: Always 
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          ports:
            - containerPort: 5432
          envFrom: 
            - secretRef:
                name: postgres-secret 
          startupProbe:
            exec:
              command:
                - sh 
                - -c 
                - pg_isready -U "$POSTGRES_USER"
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh 
                - -c 
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30 
            periodSeconds: 10 
          readinessProbe:
            exec:
              command:
                - sh 
                - -c 
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: cloud-native-keyvault
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        storageClassName: default 
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi