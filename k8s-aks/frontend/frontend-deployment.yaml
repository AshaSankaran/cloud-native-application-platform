apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: cloud-native-app  
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: frontend 
  template:
    metadata: 
      labels: 
        app: frontend 
    spec: 
      containers: 
        - name: frontend-container
          image: acrcloudnative.azurecr.io/cloud-native-frontend:IMAGE_TAG
          imagePullPolicy: Always
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 20 
            periodSeconds: 5 
          readinessProbe:
            httpGet:
              path: /
              port: 80 
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80 
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi" 
          ports: 
            - containerPort: 80 
