name: Cloud Native CI/CD Pipeline
on:
  push: 
    branches:
      - main
  workflow_dispatch: 
env:
  IMAGE_TAG: ${{github.run_number}}
jobs:
  ci-pipeline-job: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Verify Azure Login
        run: az account show
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 
      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend
      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend
      - name: Build PostgreSQL Image
        run: |
          docker build \
            -t ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./database
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with: 
          image-ref: ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Scan PostgreSQL Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-postgres.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Tag Docker Images
        run: |
          docker tag \
            ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag \
            ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker tag \
            ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}
      - name: Push Docker Images
        run: |
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}
      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-reports
          path: |
            trivy-backend.sarif
            trivy-frontend.sarif
            trivy-postgres.sarif