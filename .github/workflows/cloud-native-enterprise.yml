name: Cloud Native Enterprise Pipeline
on:
  push:
    branches:
      - main
  workflow_dispatch: 
env: 
  IMAGE_TAG: ${{ github.run_number }}

jobs: 
  build-images: 
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout Repository 
        uses: actions/checkout@v4 

      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3 

      - name : Build Backend Image 
        run: | 
          docker build \
            -t ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./backend 
          
      - name: Build Frontend Image
        run: | 
          docker build \
            -t ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./frontend 

      - name: Build PostgreSQL Image 
        run: | 
          docker build \
            -t ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }} \
            ./database  

      - name: Save Docker Images 
        run: |
          docker save \
            -o backend.tar \
            ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker save \
            -o frontend.tar \
            ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker save \
            -o postgres.tar \
            ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Upload Docker Images 
        uses: actions/upload-artifact@v4 
        with: 
          name: docker-images-cloud-native-app 
          path: | 
            backend.tar 
            frontend.tar
            postgres.tar 

  security-scan: 
    needs: build-images 
    runs-on: ubuntu-latest 
    steps: 
      - name: Download Docker Images from Artifacts 
        uses: actions/download-artifact@v4 
        with: 
          name: docker-images-cloud-native-app  

      - name: Load Docker Images 
        run: |
          docker load -i backend.tar 
          docker load -i frontend.tar 
          docker load -i postgres.tar 

      - name: Scan Backend Image with Trivy 
        uses: aquasecurity/trivy-action@v0.36.0 
        with: 
          image-ref: ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif 
          output: trivy-backend.sarif 
          severity: HIGH,CRITICAL
          ignore-unfixed: true 
          exit-code: '0'

      - name: Scan Frontend Image with Trivy 
        uses: aquasecurity/trivy-action@v0.36.0 
        with: 
          image-ref: ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif 
          severity: HIGH,CRITICAL
          ignore-unfixed: true 
          exit-code: '0'

      - name: Scan PostgreSQL Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0 
        with: 
          image-ref: ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-postgres.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true 
          exit-code: '0'

      - name: Upload Trivy Artifacts 
        if: always()
        uses: actions/upload-artifact@v4 
        with: 
          name: trivy-security-reports-cloud-native-app 
          path: | 
            trivy-backend.sarif 
            trivy-frontend.sarif 
            trivy-postgres.sarif 
  push-images: 
    needs: security-scan
    runs-on: ubuntu-latest 
    steps: 
      - name: Download Docker Images 
        uses: actions/download-artifact@v4 
        with: 
          name: docker-images-cloud-native-app 
       
      - name: Verify Downloaded Files
        run: ls -lh 

      - name: Load Docker Images 
        run: |
          docker load -i backend.tar 
          docker load -i frontend.tar 
          docker load -i postgres.tar 
        
      - name: Verify Images 
        run: docker images 

      - name: Azure Login 
        uses: azure/login@v2 
        with: 
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure Login
        run: az account show 

      - name: Login to ACR 
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Tag Docker Images 
        run: |
          docker tag \
            ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker tag \
            ${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.BACKEND_IMAGE }}:latest

          docker tag \
            ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

          docker tag \
            ${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.FRONTEND_IMAGE }}:latest

          docker tag \
            ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}

          docker tag \
            ${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.DATABASE_IMAGE }}:latest

      - name: Push Docker Images to ACR 
        run: |
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.BACKEND_IMAGE}}:latest

          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.FRONTEND_IMAGE }}:latest

          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.DATABASE_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.DATABASE_IMAGE }}:latest 